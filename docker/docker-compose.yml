services:
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    ports:
      - "27007:27017"

    volumes:
      - mongodb:/data/db

    networks:
      - backend

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    restart: always

  qdrant:
    image: qdrant/qdrant:v1.15.0 # pin a version; check Docker Hub for the latest
    container_name: qdrant
    ports:
      - "6333:6333" # REST API + web dashboard
      - "6334:6334" # gRPC (faster for bulk upserts)
    volumes:
      - qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    networks:
      - backend
    restart: always

networks:
  backend:

volumes:
  mongodb:
  qdrant:
